# 拉取式部署：推 main 後 CI 會發布 ghcr.io 映像，Watchtower 每 5 分鐘檢查並更新。
# 請把映像路徑改成你的 GitHub 擁有者／儲存庫（皆小寫）。
services:
  flip-blocks:
    image: ghcr.io/nycu-police/flip-blocks:latest
    container_name: flip-blocks
    ports:
      - "8787:8787"
    restart: unless-stopped
    environment:
      PORT: "8787"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: flip-blocks-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
