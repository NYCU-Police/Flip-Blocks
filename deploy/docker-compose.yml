# 拉取式部署：推 main 後 CI 會發布映像，Watchtower 定期檢查並更新。
# 請把映像路徑改成你的 GitHub 擁有者／儲存庫（皆小寫）。
# 限額與 TRUST_PROXY 請放本機 .env（由 .env.example 複製），不要寫進此範例。
services:
  flip-blocks:
    image: "ghcr.io/<owner>/<repo>:latest"
    container_name: flip-blocks
    ports:
      - "8787:8787"
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
      TRUST_PROXY: ${TRUST_PROXY}
      MAX_ROOMS: ${MAX_ROOMS}
      MAX_ROOMS_PER_IP: ${MAX_ROOMS_PER_IP}
      MAX_SOCKETS_PER_IP: ${MAX_SOCKETS_PER_IP}
      CREATE_PER_MIN: ${CREATE_PER_MIN}
      HTTP_PER_MIN: ${HTTP_PER_MIN}
      MAX_CLIENTS: ${MAX_CLIENTS}
      RATE_LIMIT: ${RATE_LIMIT}
    volumes:
      - ./data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: flip-blocks-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
